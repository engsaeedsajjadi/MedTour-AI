services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: medtour
      POSTGRES_USER: medtour
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password in .env}
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - medtour_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medtour -d medtour"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ./backend
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python -m app.initialize && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
volumes:
  medtour_pg:
