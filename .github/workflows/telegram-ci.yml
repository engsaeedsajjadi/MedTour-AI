name: Telegram gateway regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  telegram-tests:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: sqlite://
      JWT_SECRET: synthetic_telegram_test_secret_longer_than_32_bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify multilingual Telegram webhook and Compose boundaries
        working-directory: backend
        run: python -m pytest -q tests/test_telegram.py tests/test_section_35_devops.py
